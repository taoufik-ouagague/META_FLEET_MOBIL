name: meta_fleet
description: "Application mobile Meta Fleet - Gestion de parc et GMAO"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0-290.4.beta

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  logger: ^2.0.2
  image_picker: ^1.0.7
  printing: ^5.14.3
  # Lecture des descriptions audio des demandes d'OR (GED).
  audioplayers: ^6.5.1
  # Fichier temporaire pour la lecture audio (extension requise sur iOS).
  path_provider: ^2.1.5
  record: ^6.2.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/
